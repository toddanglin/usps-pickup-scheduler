name: Pickup
options:
  bundleIdPrefix: com.toddanglin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Pickup:
    type: application
    platform: macOS
    sources:
      - path: Pickup
        excludes: ["Info.plist"]
    info:
      path: Pickup/Info.plist
      properties:
        CFBundleDisplayName: Pickup
        CFBundleName: Pickup
        # Without these XcodeGen writes a literal "1.0" / "1", and Settings ›
        # General would not show MARKETING_VERSION.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Todd Anglin. MIT License."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Pickup/Pickup.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Read-only, and only PickupBar's own preferences plist: the one-time
        # migration from the app's old name (Pickup/App/LegacyMigration.swift)
        # copies the saved settings out of PickupBar's sandbox container.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Containers/com.toddanglin.PickupBar/Data/Library/Preferences/com.toddanglin.PickupBar.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toddanglin.Pickup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
  PickupTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PickupTests]
    dependencies:
      - target: Pickup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.toddanglin.PickupTests
  PickupUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [PickupUITests]
    dependencies:
      - target: Pickup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.toddanglin.PickupUITests
        # The XCTRunner app and the .xctest bundle are both ad-hoc signed, and
        # ad-hoc signatures never match each other under the hardened runtime,
        # so the runner refuses to dlopen the test bundle. Local UI testing
        # does not need the hardened runtime.
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Pickup:
    build:
      targets: { Pickup: all, PickupTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [PickupTests]
  PickupUITests:
    build:
      targets: { Pickup: all, PickupUITests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [PickupUITests]
