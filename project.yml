name: PickupBar
options:
  bundleIdPrefix: com.toddanglin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  PickupBar:
    type: application
    platform: macOS
    sources:
      - path: PickupBar
        excludes: ["Info.plist"]
    info:
      path: PickupBar/Info.plist
      properties:
        CFBundleDisplayName: PickupBar
        CFBundleName: PickupBar
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Todd Anglin. MIT License."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: PickupBar/PickupBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toddanglin.PickupBar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
  PickupBarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PickupBarTests]
    dependencies:
      - target: PickupBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.toddanglin.PickupBarTests
  PickupBarUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [PickupBarUITests]
    dependencies:
      - target: PickupBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.toddanglin.PickupBarUITests
        # The XCTRunner app and the .xctest bundle are both ad-hoc signed, and
        # ad-hoc signatures never match each other under the hardened runtime,
        # so the runner refuses to dlopen the test bundle. Local UI testing
        # does not need the hardened runtime.
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  PickupBar:
    build:
      targets: { PickupBar: all, PickupBarTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [PickupBarTests]
  PickupBarUITests:
    build:
      targets: { PickupBar: all, PickupBarUITests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [PickupBarUITests]
